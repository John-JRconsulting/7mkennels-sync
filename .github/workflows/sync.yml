name: Publish 7mkennels
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 sync.py
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
